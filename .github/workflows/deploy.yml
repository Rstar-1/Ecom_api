name: Deploy Node.js App to AWS EC2

on:
  push:
    branches:
      - development

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ec2-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT CODE
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 4. RUN TESTS
      # ==========================================
      - name: Run tests
        run: npm test --if-present

      # ==========================================
      # 5. BUILD TYPESCRIPT APPLICATION
      # ==========================================
      - name: Build application
        run: npm run build

      # ==========================================
      # 6. PREPARE EC2 DIRECTORY PERMISSIONS
      # ==========================================
      - name: Prepare EC2 deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "Preparing application directory..."

            sudo mkdir -p /var/www/Ecom_api

            sudo chown -R "$(id -un):$(id -gn)" /var/www/Ecom_api

            sudo chmod 755 /var/www/Ecom_api

            echo "Directory permissions configured successfully"

      # ==========================================
      # 7. DEPLOY FILES TO EC2 USING RSYNC
      # ==========================================
      - name: Copy application to EC2
        uses: burnett01/rsync-deployments@v8
        with:
          switches: >-
            -avzr
            --delete
            --exclude=node_modules
            --exclude=.git
            --exclude=.github
            --exclude=.env
            --exclude=.env.*
            --exclude=*.log
          path: ./
          remote_path: /var/www/Ecom_api/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USERNAME }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}
          remote_port: 22

      # ==========================================
      # 8. INSTALL PRODUCTION DEPENDENCIES
      # ==========================================
      # 9. START OR RESTART PM2
      # 10. VALIDATE AND RELOAD NGINX
      # ==========================================
      - name: Install and restart application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "=================================="
            echo "Starting deployment"
            echo "=================================="

            cd /var/www/Ecom_api

            # Install production dependencies
            echo "Installing production dependencies..."

            npm ci --omit=dev

            # Verify build output
            if [ ! -f dist/server.js ]; then
              echo "ERROR: dist/server.js not found"
              exit 1
            fi

            # Start or restart PM2 application
            echo "Restarting PM2 application..."

            if pm2 describe ecom-api > /dev/null 2>&1; then
              pm2 restart ecom-api --update-env
            else
              pm2 start npm --name ecom-api -- start
            fi

            # Save PM2 process list
            pm2 save

            # Check PM2 status
            echo "Checking PM2 status..."

            pm2 status

            # Validate Nginx configuration
            echo "Testing Nginx configuration..."

            sudo nginx -t

            # Reload Nginx
            echo "Reloading Nginx..."

            sudo systemctl reload nginx

            echo "=================================="
            echo "Deployment completed successfully"
            echo "=================================="

      # ==========================================
      # 11. DEPLOYMENT SUMMARY
      # ==========================================
      - name: Deployment successful
        if: success()
        run: |
          echo "Node.js application deployed successfully!"
          echo "Branch: development"
          echo "Server: AWS EC2"
          echo "Application: ecom-api"
          echo "PM2: Running"
          echo "Nginx: Reloaded"

      - name: Deployment failed
        if: failure()
        run: |
          echo "Deployment failed!"
          echo "Please check the failed step in GitHub Actions."