
name: Deploy Node.js App to AWS EC2

on:
  push:
    branches:
      - development

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ec2-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run tests (if configured)
      - name: Run tests
        run: npm test --if-present

      # Step 5: Deploy code to EC2
      - name: Copy Node.js application to EC2
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude="node_modules" --exclude=".git" --exclude=".env" --exclude=".env.*" --exclude="*.log"
          path: ./
          remote_path: /var/www/Meta_Dashboard/backend/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USERNAME }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      # Step 6: Install dependencies and restart PM2
      - name: Install dependencies and restart Node.js
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /Ecom_api

            npm ci --omit=dev

            pm2 restart meta-dashboard-api --update-env

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Node.js deployment completed successfully"
